<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>새암 가계부</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#15803d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="새암 가계부">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --ink:#1c1917; --sub:#78716c; --line:#e7e5e4; --bg:#fafaf9; --card:#ffffff;
  --in:#2563eb; --out:#dc2626; --asset:#0891b2; --debt:#ea580c;
  --personal:#15803d; --corp:#1e3a8a; --warn:#dc2626; --ok:#16a34a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:15px;line-height:1.5;padding-bottom:76px}
#app{max-width:520px;margin:0 auto;background:var(--bg);min-height:100vh}

/* ── header ── */
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);
  padding:10px 14px;display:flex;align-items:center;gap:10px;
  padding-top:calc(10px + env(safe-area-inset-top))}
#installBar{display:none;background:var(--personal);color:#fff;padding:11px 14px;
  align-items:center;gap:10px;font-size:13.5px;font-weight:700}
#installBar.show{display:flex}
#installBar button{margin-left:auto;border:0;background:#fff;color:var(--personal);
  padding:7px 14px;border-radius:8px;font-size:13px;font-weight:800;font-family:inherit;cursor:pointer}
#installBar .x{background:transparent;color:#fff;padding:7px 4px;margin-left:0;font-size:16px}
.modeToggle{display:flex;background:#f5f5f4;border-radius:999px;padding:3px;flex:0 0 auto}
.modeToggle button{border:0;background:transparent;padding:6px 14px;border-radius:999px;
  font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;transition:.15s}
.modeToggle button.on{background:var(--personal);color:#fff}
body.corp .modeToggle button.on{background:var(--corp)}
.monthNav{margin-left:auto;display:flex;align-items:center;gap:4px}
.monthNav button{border:0;background:#f5f5f4;width:28px;height:28px;border-radius:8px;
  cursor:pointer;font-size:14px;color:var(--sub)}
.monthNav span{font-weight:700;font-size:14px;min-width:78px;text-align:center}

/* ── layout ── */
main{padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:13px;font-weight:800;color:var(--sub);letter-spacing:.02em}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:14px}
.row+.row{border-top:1px solid #f5f5f4}
.row .lbl{color:var(--sub)}
.row .val{font-weight:700;font-variant-numeric:tabular-nums}
.row.total{border-top:2px solid var(--ink);margin-top:4px;padding-top:9px;font-size:15px}
.row.total .lbl{color:var(--ink);font-weight:800}
.in{color:var(--in)} .out{color:var(--out)} .asset{color:var(--asset)} .debt{color:var(--debt)}
.muted{color:var(--sub);font-size:12px}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:22px 0}

/* ── 현금흐름 다이어그램 ── */
.cf{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.cfTitle{font-size:13px;font-weight:800;color:var(--sub);margin-bottom:12px}
.cfBox{border:2px solid var(--ink);border-radius:10px;overflow:hidden;margin-bottom:0}
.cfBox .cfHead{background:var(--ink);color:#fff;font-size:11px;font-weight:800;padding:4px 9px;letter-spacing:.04em}
.cfHalf{padding:9px 11px}
.cfHalf+.cfHalf{border-top:1px dashed var(--line)}
.cfHalf .t{font-size:11px;font-weight:800;margin-bottom:5px}
.cfItem{display:flex;justify-content:space-between;font-size:12.5px;padding:2px 0;color:var(--sub)}
.cfItem b{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.cfArrow{display:flex;align-items:center;justify-content:center;gap:8px;padding:5px 0;font-size:11px;color:var(--sub)}
.cfArrow .a{font-size:15px;line-height:1}
.freedom{margin-top:12px;padding:11px;border-radius:10px;background:#f0fdf4;border:1px solid #bbf7d0}
body.corp .freedom{background:#eff6ff;border-color:#bfdbfe}
.freedom .fTop{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:7px}
.bar{height:9px;background:#e7e5e4;border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:.4s}

/* ── forms ── */
label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;
  font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--personal);outline-offset:-1px}
body.corp input:focus,body.corp select:focus,body.corp textarea:focus{outline-color:var(--corp)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dateGroup{display:flex;align-items:center;gap:5px}
.dateGroup input{text-align:center;padding:10px 2px;font-variant-numeric:tabular-nums;
  -moz-appearance:textfield;min-width:0}
.dateGroup input::-webkit-outer-spin-button,
.dateGroup input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.dateGroup .yy{flex:1.5} .dateGroup .mm,.dateGroup .dd{flex:1}
.dateGroup span{font-size:12.5px;font-weight:700;color:var(--sub);flex:0 0 auto}
.dateGroup .todayBtn{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:8px;
  padding:9px 10px;font-size:12px;font-weight:700;color:var(--sub);cursor:pointer;font-family:inherit;margin-left:2px}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--personal);color:#fff;
  font-size:15px;font-weight:800;cursor:pointer;margin-top:14px;font-family:inherit}
body.corp .btn{background:var(--corp)}
.btn.sub{background:#f5f5f4;color:var(--ink);font-weight:700;font-size:13px;padding:9px;margin-top:8px}
.btn.danger{background:#fef2f2;color:var(--out)}
.segRow{display:flex;gap:6px;margin-top:4px}
.segRow button{flex:1;padding:9px;border:1px solid var(--line);background:#fff;border-radius:9px;
  font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;font-family:inherit}
.segRow button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ── list ── */
.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #f5f5f4}
.item:last-child{border-bottom:0}
.item .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  font-size:11px;font-weight:800;flex:0 0 auto;color:#fff}
.item .mid{flex:1;min-width:0}
.item .mid .n{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mid .s{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:800;font-variant-numeric:tabular-nums;font-size:14px;text-align:right;flex:0 0 auto}
.del{border:0;background:transparent;color:#d6d3d1;font-size:17px;cursor:pointer;padding:0 2px;flex:0 0 auto}
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:5px;
  background:#f5f5f4;color:var(--sub);margin-right:4px}
.tag.bad{background:#fef2f2;color:var(--warn)}
.tag.good{background:#f0fdf4;color:var(--ok)}
.tag.auto{background:#eff6ff;color:var(--in)}

/* ── nav ── */
nav.bn{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);
  border-top:1px solid var(--line);display:flex;max-width:520px;margin:0 auto;
  padding-bottom:env(safe-area-inset-bottom)}
nav.bn button{flex:1;border:0;background:transparent;padding:9px 2px 11px;cursor:pointer;
  font-size:10.5px;font-weight:700;color:#a8a29e;font-family:inherit;line-height:1.3}
nav.bn button .i{display:block;font-size:17px;margin-bottom:2px}
nav.bn button.on{color:var(--personal)}
body.corp nav.bn button.on{color:var(--corp)}
.alert{background:#fef2f2;border:1px solid #fecaca;border-radius:11px;padding:11px;margin-bottom:12px}
.alert .t{font-size:13px;font-weight:800;color:var(--warn);margin-bottom:3px}
.alert .d{font-size:12.5px;color:#991b1b}
.hr{height:1px;background:var(--line);margin:12px 0}

/* ── 분할매수 계산기 ── */
.ordTbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.ordTbl th{background:#f5f5f4;color:var(--sub);font-size:11px;font-weight:800;
  padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
.ordTbl th:first-child{text-align:left}
.ordTbl td{padding:6px 4px;text-align:right;border-bottom:1px solid #f5f5f4;
  font-variant-numeric:tabular-nums}
.ordTbl td:first-child{text-align:left;color:var(--sub);font-size:12px}
.ordTbl tr.key td{font-weight:800;background:#fffbeb}
.ordTbl tfoot td{font-weight:800;border-top:1px solid var(--ink);border-bottom:0}
.badge{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 8px;
  border-radius:6px;background:var(--ink);color:#fff}
.badge.f{background:var(--in)} .badge.s{background:var(--debt)} .badge.x{background:var(--warn)}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:5px 0}
.kv+.kv{border-top:1px solid #f5f5f4}
.kv b{font-variant-numeric:tabular-nums}
.evtRow{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.evtRow button{padding:10px 4px;border:1px solid var(--line);background:#fff;border-radius:9px;
  font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit}
.evtRow button:active{background:#f5f5f4}
.disc{background:#fafaf9;border:1px dashed var(--line);border-radius:10px;
  padding:10px;font-size:11.5px;color:var(--sub);line-height:1.55;margin-top:12px}
</style>
</head>
<body class="personal">
<div id="app">
  <div id="installBar">
    <span>홈 화면에 추가하면 앱처럼 쓸 수 있어요</span>
    <button onclick="doInstall()">설치</button>
    <button class="x" onclick="document.getElementById('installBar').classList.remove('show')">×</button>
  </div>
  <header>
    <div class="modeToggle">
      <button id="mP" class="on" onclick="setMode('personal')">개인</button>
      <button id="mC" onclick="setMode('corp')">법인</button>
    </div>
    <div class="monthNav">
      <button onclick="moveMonth(-1)">‹</button>
      <span id="monthLabel"></span>
      <button onclick="moveMonth(1)">›</button>
    </div>
  </header>
  <main id="view"></main>
  <nav class="bn" id="nav"></nav>
</div>

<script>
/* ═══════════════ 저장소 ═══════════════ */
const KEY='saeam_ledger_v01';

  try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}
  return mem||null;
}
function save(){
  mem=S;
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
}

/* ═══════════════ 카테고리 정의 ═══════════════ */
// 불로소득 = 자산이 스스로 만들어내는 수입
const PASSIVE=['임대료 수입','배당금','이자','로열티'];

// 법인 손익 분류
const CORP_REV_OP=['부동산 매출','임대수익','용역수익'];

/* ═══════════════ 세무 일정 ═══════════════ */
const TAXCAL=[
  {m:1, d:25, name:'부가가치세 확정신고 (2기)', who:'corp'},
  {m:2, d:10, name:'원천세 신고·납부', who:'corp'},

  {m:5, d:31, name:'종합소득세 신고 (근로+임대소득)', who:'personal'},

  {m:10,d:25, name:'부가가치세 예정신고 (2기)', who:'corp'}

/* ═══════════════ 초기 상태 ═══════════════ */

  return{
    personal:{tx:[],assets:[],debts:[],recur:[],splits:[]},
    corp:{tx:[],assets:[],debts:[],recur:[],props:[],adv:[]}
  };
}

  const d=(day)=>`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

         buy:'2026-08-01',cost:0,status:'보유(임차)',memo:'쉼자락 공간대여 운영'}
      ],

function u(){return Math.random().toString(36).slice(2,10)}

let S=load()||blank();
// 구버전 데이터 호환
if(!S.personal.splits) S.personal.splits=[];
let MODE='personal';
let TAB='dash';
let CUR=new Date();

/* ═══════════════ 계산 유틸 ═══════════════ */
const won=n=>(n<0?'-':'')+Math.abs(Math.round(n)).toLocaleString('ko-KR')+'원';
const wonS=n=>{const a=Math.abs(n);
  if(a>=100000000)return (n/100000000).toFixed(a%100000000===0?0:1)+'억';
  if(a>=10000)return Math.round(n/10000).toLocaleString('ko-KR')+'만';
  return n.toLocaleString('ko-KR');};
const ym=dt=>`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`;
const daysIn=(y,m)=>new Date(y,m,0).getDate();

/* ═══════════════ 범용 분할매수 계산기 ═══════════════ */
/* 사용자가 입력한 파라미터로 주문 가격·수량을 계산해 보여주는 도구입니다.
   특정 매매 기법을 권유하거나 매매를 지시하지 않습니다. */

function splitDefaults(){
  return{
    id:u(), name:'',
    principal:0,          // 원금
    cash:0,               // 잔금
    a:40,                 // 분할수
    M:10,                 // 목표수익률 기준 %
    sellTarget:10,        // 지정가 매도 목표 %
    frontRatio:50,        // 전반부에서 기준선에 배분할 비율 %
    partRatio:25,         // 분할매도 비율 %
    ladderSteps:8,        // 추가매수 사다리 단계
    ladderDrop:7,         // 사다리 단계별 하락률 %
    avg:0, qty:0, turn:0, // 평단 / 보유수량 / 회차
    closes:[],            // 최근 종가 (소진구간 기준선 산정용)
    useSMA:true,          // 소진구간에서 종가평균을 기준선으로 사용
    firstDay:false        // 소진 첫날 (매수 없음)
  };
}

// 구간 판정
function splitPhase(p){
  const a=+p.a||1;
  if(p.turn >= a-1) return 'exhaust';
  return p.turn < a/2 ? 'front' : 'back';
}
const PHASE_LABEL={front:'전반부', back:'후반부', exhaust:'소진구간'};
const PHASE_CLS={front:'f', back:'s', exhaust:'x'};

// 기준선 계산
function splitBaseline(p){
  const phase=splitPhase(p);
  const a=+p.a||1, M=+p.M||0;
  if(phase==='exhaust' && p.useSMA && (p.closes||[]).length>0){
    const avgClose=p.closes.reduce((s,c)=>s+c,0)/p.closes.length;
    return{ phase, price:avgClose, pct:p.avg>0?(avgClose/p.avg-1)*100:0, src:'종가평균' };
  }
  const pct = M * (1 - 2*p.turn/a);
  return{ phase, price:p.avg*(1+pct/100), pct, src:'평단기준' };
}

// 1회 매수금
function splitUnitBuy(p){
  const phase=splitPhase(p), a=+p.a||1;
  if(phase==='exhaust') return (+p.cash||0)/4;
  const left=Math.max(0.01, a-p.turn);
  return (+p.cash||0)/left;
}

// 매수 주문표
function splitBuyOrders(p){
  const b=splitBaseline(p), unit=splitUnitBuy(p);
  const out=[];
  if(p.firstDay && b.phase==='exhaust') return out;   // 소진 첫날은 매수 없음
  const buyPx = Math.max(0.01, b.price - 0.01);       // 매도와 겹침 방지
  if(b.phase==='front'){
    const r=(+p.frontRatio||50)/100;
    const a1=unit*r, a2=unit*(1-r);
    if(buyPx>0) out.push({label:'기준선', px:buyPx, qty:Math.floor(a1/buyPx), key:true});
    if(p.avg>0) out.push({label:'평단', px:p.avg, qty:Math.floor(a2/p.avg), key:true});
  }else{
    if(buyPx>0) out.push({label:'기준선', px:buyPx, qty:Math.floor(unit/buyPx), key:true});
  }
  // 추가매수 사다리
  const base = out.length ? out[out.length-1].px : buyPx;
  const drop=(+p.ladderDrop||0)/100;
  let px=base;
  for(let i=0;i<(+p.ladderSteps||0);i++){
    px = px*(1-drop);
    if(px<=0.01)break;
    out.push({label:'추가 '+(i+1), px:Math.round(px*100)/100, qty:1});
  }
  return out;
}

// 매도 주문표
function splitSellOrders(p){
  const b=splitBaseline(p);
  const qty=Math.floor(+p.qty||0);
  const out=[];
  if(qty<=0) return out;
  if(b.phase==='exhaust'){
    const n=Math.max(2,Math.round((+p.a||40)/2));
    const part=Math.floor(qty/n);
    if(p.firstDay){
      out.push({label:'전량기준 분할 (종가매도)', px:null, qty:part, key:true, note:'MOC'});
    }else{
      out.push({label:'기준선', px:b.price, qty:part, key:true});
    }
    const rest=qty-part;
    if(rest>0) out.push({label:'목표가', px:p.avg*(1+(+p.sellTarget||0)/100), qty:rest});
  }else{
    const part=Math.floor(qty*(+p.partRatio||25)/100);
    if(part>0) out.push({label:'기준선', px:b.price, qty:part, key:true});
    const rest=qty-part;
    if(rest>0) out.push({label:'목표가', px:p.avg*(1+(+p.sellTarget||0)/100), qty:rest});
  }
  return out;
}

// 회차 이벤트 적용
function splitEvent(id,kind){
  const p=(S.personal.splits||[]).find(x=>x.id===id);
  if(!p)return;
  const a=+p.a||40;
  const ex = splitPhase(p)==='exhaust';
  // 회차 갱신 규칙
  //  · 매수 체결  → 소진구간에서는 남은 여력(a−회차)의 25%만, 그 전에는 매수분(1 또는 0.5)만큼 증가
  //  · 분할매도    → 매도한 비중만큼 회차를 되돌림
  //                  (일반구간: 분할매도 비율,  소진구간: 매도수량 규칙 1/(분할수÷2) = 2/분할수)
  //  · 목표가 전량매도 → 사이클 종료 (원금 상태로 복귀)
  if(kind==='full')      p.turn = ex ? p.turn + (a-p.turn)*0.25 : p.turn + 1;
  else if(kind==='half') p.turn = ex ? p.turn + (a-p.turn)*0.25 : p.turn + 0.5;
  else if(kind==='part') p.turn = ex ? p.turn * (1 - 2/a) : p.turn * (1-(+p.partRatio||25)/100);
  else if(kind==='target'||kind==='reset'){
    p.turn=0; p.qty=0; p.avg=0; p.cash=+p.principal||0;
    p.closes=[]; p.firstDay=false; p.firstDayDone=false;
  }
  p.turn = Math.max(0, Math.round(p.turn*100000)/100000);
  if(splitPhase(p)==='exhaust' && kind!=='reset' && kind!=='target' && p.turn>=a-1 && !p.firstDayDone){
    p.firstDay=true; p.firstDayDone=true;
  }
  if(kind==='part') p.firstDay=false;
  save();render();
  if(kind==='target') alert('사이클을 종료했습니다.\n실제 매도대금이 원금과 다르면 아래 원금·잔금을 수정해 주세요.');
}

/* ── 직접 입력형 날짜 필드 (년/월/일 각각 타이핑) ── */
function dateField(id,val,opt){
  const p=(val||'').split('-');
  const y=p[0]||'', m=p[1]?+p[1]:'', d=p[2]?+p[2]:'';
  return `<div class="dateGroup">
    <input type="number" class="yy" id="${id}_y" inputmode="numeric" placeholder="2026"
      value="${y}" oninput="dgStep('${id}','y',this)">
    <span>년</span>
    <input type="number" class="mm" id="${id}_m" inputmode="numeric" placeholder="7" min="1" max="12"
      value="${m}" oninput="dgStep('${id}','m',this)">
    <span>월</span>
    <input type="number" class="dd" id="${id}_d" inputmode="numeric" placeholder="15" min="1" max="31"
      value="${d}" oninput="dgStep('${id}','d',this)">
    <span>일</span>
    ${opt==='today'?`<button type="button" class="todayBtn" onclick="setToday('${id}')">오늘</button>`:''}
  </div>`;
}
function dgStep(id,part,el){
  let v=el.value;
  if(part==='y'){
    if(v.length>4){el.value=v.slice(0,4);v=el.value;}
    if(v.length>=4){const n=document.getElementById(id+'_m');if(n)n.focus();}
  }
  if(part==='m'){
    if(+v>12)el.value=12;
    if(v.length>=2||+v>1){const n=document.getElementById(id+'_d');if(n)n.focus();}
  }
  if(part==='d'){
    const y=+(document.getElementById(id+'_y')||{}).value||2026;
    const mm=+(document.getElementById(id+'_m')||{}).value||1;
    const max=daysIn(y,mm);
    if(+v>max)el.value=max;
  }
  if(typeof calcPreview==='function')calcPreview();
}
function setToday(id){
  const t=new Date();
  const set=(k,v)=>{const e=document.getElementById(id+'_'+k);if(e)e.value=v;};
  set('y',t.getFullYear()); set('m',t.getMonth()+1); set('d',t.getDate());
  if(typeof calcPreview==='function')calcPreview();
}
function getDate(id){
  const g=k=>+(document.getElementById(id+'_'+k)||{}).value||0;
  const y=g('y'), m=g('m'), d=g('d');
  if(!y||!m||!d)return '';
  return `${y}-${String(m).padStart(2,'0')}-${String(Math.min(d,daysIn(y,m))).padStart(2,'0')}`;
}

/* ── 대출 계산 엔진 ── */
// 시작일~만기일 사이 개월 수
function monthsBetween(s,e){
  if(!s||!e)return 0;
  const a=new Date(s), b=new Date(e);
  let n=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
  if(b.getDate()>=a.getDate())n+=0; else n-=0;
  return Math.max(1,n);
}
// 대출 기본 정보: 총 회차, 월 납입액(원리금균등 기준)
function loanInfo(d){
  const P=d.principal||d.bal||0;
  const r=(d.rate||0)/100/12;
  const n=d.end&&d.start?monthsBetween(d.start,d.end):(d.months||0);
  let monthly=0;
  if(d.method==='원리금균등'&&n>0){
    monthly = r===0 ? P/n : P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
  }else if(d.method==='원금균등'&&n>0){
    monthly = P/n + P*r;            // 첫 회차 기준(이후 감소)
  }else{
    monthly = P*r;                   // 만기일시 = 매월 이자만
  }
  return {P,r,n,monthly};
}
// 특정 연월의 상환 상태 (k회차 기준)
function loanAt(d,y,m){
  const {P,r,n} = loanInfo(d);
  if(!d.start)return{k:0,balance:d.bal||0,interest:(d.bal||0)*r,principal:0,payment:(d.bal||0)*r,done:false,before:false};
  const s=new Date(d.start);
  const k=(y-s.getFullYear())*12+(m-1-s.getMonth())+1;   // 1회차부터
  if(k<1)return{k:0,balance:P,interest:0,principal:0,payment:0,done:false,before:true};
  if(n>0&&k>n)return{k,balance:0,interest:0,principal:0,payment:0,done:true,before:false};

  let balance,interest,principal,payment;
  if(d.method==='원리금균등'&&n>0){
    const {monthly}=loanInfo(d);
    balance = r===0 ? P-(P/n)*(k-1)
      : P*Math.pow(1+r,k-1) - monthly*(Math.pow(1+r,k-1)-1)/r;
    balance=Math.max(0,balance);
    interest=balance*r;
    principal=Math.min(balance,monthly-interest);
    payment=monthly;
  }else if(d.method==='원금균등'&&n>0){
    const pp=P/n;
    balance=Math.max(0,P-pp*(k-1));
    interest=balance*r;
    principal=Math.min(balance,pp);
    payment=principal+interest;
  }else{
    balance=P;
    interest=P*r;
    principal=(n>0&&k===n)?P:0;
    payment=interest+principal;
  }
  return{k,balance,interest,principal,payment,done:false,before:false};
}
// 현재 잔액 (오늘 기준)
function loanBalanceNow(d){
  const t=new Date();
  const st=loanAt(d,t.getFullYear(),t.getMonth()+1);
  return st.done?0:Math.round(st.balance);
}
// 완제 예정일
function loanEndLabel(d){
  const {n}=loanInfo(d);
  if(!d.start||!n)return '만기일시상환';
  const s=new Date(d.start);
  const e=new Date(s.getFullYear(),s.getMonth()+n,1);
  return `${e.getFullYear()}.${String(e.getMonth()+1).padStart(2,'0')} 완제 예정 (총 ${n}회)`;
}
// 구버전 호환
function loanMonthly(d){
  const t=new Date();
  const st=loanAt(d,t.getFullYear(),t.getMonth()+1);
  return{int:st.interest, principal:st.principal, total:st.payment};
}

// 해당 월의 자동 반영 거래 (반복거래 + 대출이자) 생성
function autoTx(mode,y,m){
  const D=S[mode], out=[];
  const dim=daysIn(y,m);
  (D.recur||[]).forEach(r=>{
    if(!r.on)return;
    const day=Math.min(r.day||1,dim);
    out.push({id:'r_'+r.id,date:`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`,
      kind:r.kind,cat:r.cat,amt:r.amt,memo:r.memo,auto:'반복',ev:r.ev||'',evOk:true});
  });
  (D.debts||[]).forEach(d=>{
    const st=loanAt(d,y,m);
    if(st.before||st.done||st.payment<=0)return;
    const day=Math.min(d.day||1,dim);
    out.push({id:'d_'+d.id,date:`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`,
      kind:'지출',cat:mode==='corp'?'이자비용':'대출 이자',amt:Math.round(st.payment),
      memo:`${d.name} ${st.k}회차 (이자 ${won(st.interest)}${st.principal>0?' + 원금 '+won(st.principal):''})`,
      auto:'대출',ev:'',evOk:true});
  });
  return out;
}

function monthTx(mode,y,m){
  const key=`${y}-${String(m).padStart(2,'0')}`;
  const manual=(S[mode].tx||[]).filter(t=>t.date.startsWith(key));
  return [...manual,...autoTx(mode,y,m)].sort((a,b)=>b.date.localeCompare(a.date));
}

function pnl(mode,y,m){
  const tx=monthTx(mode,y,m);
  const inc={},exp={};
  let inTot=0,outTot=0,passive=0;
  tx.forEach(t=>{
    if(t.kind==='수입'){inc[t.cat]=(inc[t.cat]||0)+t.amt;inTot+=t.amt;
      if(PASSIVE.includes(t.cat))passive+=t.amt;}
    else if(t.kind==='지출'){exp[t.cat]=(exp[t.cat]||0)+t.amt;outTot+=t.amt;}
  });
  return{inc,exp,inTot,outTot,passive,net:inTot-outTot,tx};
}

function bs(mode){
  const D=S[mode];
  const aTot=(D.assets||[]).reduce((s,a)=>s+(a.val||0),0);
  const dTot=(D.debts||[]).reduce((s,d)=>s+loanBalanceNow(d),0);
  return{aTot,dTot,net:aTot-dTot,assets:D.assets||[],debts:D.debts||[]};
}

function corpPnl(y,m){
  const p=pnl('corp',y,m);
  let revOp=0,revNon=0,cogs=0,sga=0,expNon=0;
  Object.entries(p.inc).forEach(([c,v])=>{CORP_REV_NONOP.includes(c)?revNon+=v:revOp+=v;});
  Object.entries(p.exp).forEach(([c,v])=>{
    if(CORP_COGS.includes(c))cogs+=v;
    else if(CORP_EXP_NONOP.includes(c))expNon+=v;
    else sga+=v;});
  const gross=revOp-cogs, op=gross-sga, net=op+revNon-expNon;
  return{...p,revOp,revNon,cogs,sga,expNon,gross,op,net};
}

function advBalance(){
  let 가지급금=0,가수금=0;
  (S.corp.adv||[]).forEach(a=>{
    if(a.back)return;
    if(a.dir==='가지급금')가지급금+=a.amt; else 가수금+=a.amt;
  });
  return{가지급금,가수금};
}

function taxAlert(y,m,who){
  const items=TAXCAL.filter(t=>t.who===who);

  return `<div class="card"><h3>세무 신고 일정</h3>
    ${cur.map(t=>`<div class="row"><span class="lbl" style="color:var(--warn);font-weight:800">🔴 이번 달 · ${m}/${t.d}</span>
      <span class="val" style="color:var(--warn);font-size:13px">${t.name}</span></div>`).join('')}
    ${next.map(t=>`<div class="row"><span class="lbl">다음 달 · ${t.m}/${t.d}</span>
      <span class="val" style="font-weight:600;font-size:13px;color:var(--sub)">${t.name}</span></div>`).join('')}
  </div>`;
}

function groupBy(arr,catKey,valKey){
  const g={};arr.forEach(a=>{g[a[catKey]]=(g[a[catKey]]||0)+(a[valKey]||0)});
  return Object.entries(g).sort((a,b)=>b[1]-a[1]);
}

/* ── 월 납입금 실시간 미리보기 ── */
function calcPreview(){
  const box=document.getElementById('calcBox');
  if(!box)return;
  const P=+(document.getElementById('d_principal')||{}).value||0;
  const rate=+(document.getElementById('d_rate')||{}).value||0;
  const start=getDate('d_start');
  const end=getDate('d_end');
  const method=(document.getElementById('d_method')||{}).value||'만기일시';
  if(!P){box.innerHTML='<div class="muted">원금·기간·이율을 입력하면 월 납입금액이 자동 계산됩니다.</div>';return;}
  const tmp={principal:P,rate,start,end,method,day:1};
  const info=loanInfo(tmp);
  const first=loanAt({...tmp,start:start||new Date().toISOString().slice(0,10)},
    new Date(start||Date.now()).getFullYear(), new Date(start||Date.now()).getMonth()+1);
  const totalInterest = method==='만기일시'
    ? P*info.r*info.n
    : (info.n>0 ? (method==='원리금균등' ? info.monthly*info.n-P
        : Array.from({length:info.n},(_,i)=>(P-(P/info.n)*i)*info.r).reduce((a,b)=>a+b,0)) : 0);
  box.innerHTML=`
    <div class="row"><span class="lbl">첫 달 납입액</span><span class="val" style="font-size:17px">${won(first.payment)}</span></div>
    <div class="row"><span class="lbl">└ 이자 / 원금</span><span class="val" style="font-size:13px">${won(first.interest)} / ${won(first.principal)}</span></div>
    ${info.n>0?`<div class="row"><span class="lbl">총 상환 회차</span><span class="val">${info.n}회 (${(info.n/12).toFixed(1)}년)</span></div>
    <div class="row"><span class="lbl">총 이자 부담</span><span class="val out">${won(totalInterest)}</span></div>
    <div class="row total"><span class="lbl">총 상환액</span><span class="val">${won(P+totalInterest)}</span></div>`
    :'<div class="muted" style="margin-top:6px">만기일을 입력하면 총 회차와 이자 총액도 계산됩니다.</div>'}`;
}

/* ── 알림 ── */
function askNoti(){
  if(!('Notification' in window)){alert('이 브라우저는 알림을 지원하지 않습니다.');return;}
  Notification.requestPermission().then(p=>{
    if(p==='granted'){alert('알림이 켜졌습니다. 앱을 열 때 납입일이 다가온 대출을 알려드립니다.');checkAlerts();}
    else alert('알림이 차단되어 있습니다. 브라우저 설정에서 허용해주세요.');
  });
}
function checkAlerts(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const today=new Date();
  const todayKey=today.toISOString().slice(0,10);
  ['personal','corp'].forEach(mode=>{
    (S[mode].debts||[]).forEach(d=>{
      if(d.alertDays===''||d.alertDays==null)return;
      const st=loanAt(d,today.getFullYear(),today.getMonth()+1);
      if(st.done||st.before||st.payment<=0)return;
      const dim=daysIn(today.getFullYear(),today.getMonth()+1);
      const payDay=Math.min(d.day||1,dim);
      const diff=payDay-today.getDate();
      if(diff<0||diff>+d.alertDays)return;
      if(d.lastNoti===todayKey)return;
      new Notification('납입일 알림 · 새암 가계부',{
        body:`${d.name}\n${diff===0?'오늘':diff+'일 뒤'} ${payDay}일 · ${won(st.payment)} 납입 예정`,
        icon:'icon-192.png', tag:'loan_'+d.id
      });
      d.lastNoti=todayKey;
    });
  });
  save();
}

/* ── 구글 캘린더용 .ics 내보내기 ── */
function exportICS(id){
  const d=(S[MODE].debts||[]).find(x=>x.id===id);
  if(!d)return;
  const info=loanInfo(d), st=loanAt(d,new Date().getFullYear(),new Date().getMonth()+1);
  const alertD = (d.alertDays===''||d.alertDays==null) ? 3 : +d.alertDays;
  const p=(d.start||new Date().toISOString().slice(0,10)).split('-').map(Number);
  const sy=p[0], sm=p[1], sd=p[2];
  const dim=daysIn(sy,sm);
  const day=Math.min(d.day||1,dim);
  // 시작월의 납입일이 이미 지났으면 다음 달부터
  const first = day>=sd ? new Date(sy,sm-1,day) : new Date(sy,sm,day);
  const fmt=dt=>dt.getFullYear()+String(dt.getMonth()+1).padStart(2,'0')+String(dt.getDate()).padStart(2,'0');
  let until='';
  if(info.n>0){
    const e=new Date(first.getFullYear(),first.getMonth()+info.n,day);
    until=`;UNTIL=${fmt(e)}T000000Z`;
  }
  const ics=[
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Saeam Ledger//KR','CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    `UID:${d.id}@saeam-ledger`,
    `DTSTAMP:${fmt(new Date())}T090000Z`,
    `DTSTART;VALUE=DATE:${fmt(first)}`,
    `RRULE:FREQ=MONTHLY;BYMONTHDAY=${day}${until}`,
    `SUMMARY:${d.name} 납입일 (약 ${won(st.payment)})`,
    `DESCRIPTION:연 ${d.rate}% · ${d.method} · 원금 ${won(info.P)}\\n새암 가계부에서 생성`,
    'BEGIN:VALARM',`TRIGGER:-P${alertD}D`,'ACTION:DISPLAY',`DESCRIPTION:${d.name} 납입일 ${alertD}일 전`,'END:VALARM',
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  const b=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download=`${d.name}_납입일.ics`;
  a.click();
  setTimeout(()=>alert('다운로드된 .ics 파일을 열면 구글 캘린더에 매월 반복 일정으로 등록됩니다.'),300);
}

  p.ladderSteps=+g('nc_ladderSteps')||0; p.ladderDrop=+g('nc_ladderDrop')||0;
  S.personal.splits=S.personal.splits||[];
  S.personal.splits.push(p);
  SPLIT_SEL=p.id; save(); TAB='split'; render();
}
function splitSaveState(id){
  const p=(S.personal.splits||[]).find(x=>x.id===id); if(!p)return;
  const g=k=>(document.getElementById(k)||{}).value;
  p.avg=+g('sp_avg')||0; p.qty=+g('sp_qty')||0;
  p.cash=+g('sp_cash')||0; p.turn=+g('sp_turn')||0;
  p.closes=(g('sp_closes')||'').split(',').map(s=>+s.trim()).filter(n=>n>0);
  save(); render();
}
function splitSaveCfg(id){
  const p=(S.personal.splits||[]).find(x=>x.id===id); if(!p)return;
  const g=k=>(document.getElementById(k)||{}).value;
  p.name=g('sc_name')||p.name; p.principal=+g('sc_principal')||0;
  p.a=+g('sc_a')||40; p.M=+g('sc_M')||0;
  p.sellTarget=+g('sc_sellTarget')||0; p.partRatio=+g('sc_partRatio')||25;
  p.frontRatio=+g('sc_frontRatio')||50;
  p.ladderSteps=+g('sc_ladderSteps')||0; p.ladderDrop=+g('sc_ladderDrop')||0;
  p.useSMA = g('sc_useSMA')==='1';
  save(); render();
}
function splitDel(id){
  if(!confirm('이 사이클을 삭제할까요?'))return;
  S.personal.splits=(S.personal.splits||[]).filter(x=>x.id!==id);
  SPLIT_SEL=null; save(); render();
}

/* ── 증빙·세무 (법인) ── */
function vTax(y,m){
  const key=`${y}-${String(m).padStart(2,'0')}`;
  const tx=(S.corp.tx||[]).filter(t=>t.date.startsWith(key));
  const bad=tx.filter(t=>t.kind==='지출'&&!t.evOk);
  const evStat={};
  tx.forEach(t=>{if(t.ev)evStat[t.ev]=(evStat[t.ev]||0)+1;});
  const A=advBalance();
  const vatOut=tx.filter(t=>t.kind==='수입').reduce((s,t)=>s+t.amt,0);
  const vatIn=tx.filter(t=>t.kind==='지출'&&['세금계산서','현금영수증','사업용카드'].includes(t.ev)).reduce((s,t)=>s+t.amt,0);

  return `
  ${bad.length?`<div class="alert"><div class="t">⚠️ 적격증빙 미비 ${bad.length}건 · ${won(bad.reduce((s,t)=>s+t.amt,0))}</div>
    <div class="d">아래 건은 비용 인정이 어렵거나 증빙불비 가산세(2%) 대상입니다.</div></div>`:
    `<div class="card"><div class="row"><span class="lbl">적격증빙 상태</span>
     <span class="val" style="color:var(--ok)">✓ 이번 달 미비 건 없음</span></div></div>`}

  ${bad.length?`<div class="card"><h3>증빙 보완 필요</h3>
    ${bad.map(t=>`<div class="item"><div class="ic" style="background:var(--warn)">!</div>
      <div class="mid"><div class="n">${t.cat} <span class="tag bad">${t.ev}</span></div>
        <div class="s">${t.date} · ${t.memo||''}${t.party?' · '+t.party:''}</div></div>
      <div class="amt out">${wonS(t.amt)}</div></div>`).join('')}
  </div>`:''}

  <div class="card">
    <h3>부가세 예상 (참고용)</h3>
    <div class="row"><span class="lbl">매출 합계</span><span class="val in">${won(vatOut)}</span></div>
    <div class="row"><span class="lbl">공제 가능 매입</span><span class="val out">${won(vatIn)}</span></div>
    <div class="row total"><span class="lbl">예상 납부세액 <span class="muted">(1/11 기준)</span></span>
      <span class="val">${won(Math.max(0,(vatOut-vatIn)/11))}</span></div>
    <div class="muted" style="margin-top:8px">실제 세액은 세무사 검토가 필요합니다. 여기 숫자는 감을 잡기 위한 참고값입니다.</div>
  </div>

  <div class="card">
    <h3>증빙 유형별 건수</h3>
    ${Object.keys(evStat).length?Object.entries(evStat).map(([e,c])=>
      `<div class="row"><span class="lbl">${e}</span>
       <span class="val ${EV_OK.includes(e)?'':'out'}">${c}건</span></div>`).join('')
      :'<div class="empty">이번 달 거래가 없습니다</div>'}
  </div>

  <div class="card">
    <h3>가지급금 · 가수금 대장</h3>
    ${(S.corp.adv||[]).length?S.corp.adv.map(a=>`<div class="item">
      <div class="ic" style="background:${a.dir==='가지급금'?'var(--warn)':'var(--in)'}">${a.dir==='가지급금'?'給':'受'}</div>
      <div class="mid"><div class="n">${a.dir} ${a.back?'<span class="tag good">상환완료</span>':''}</div>
        <div class="s">${a.date} · ${a.reason}</div></div>
      <div class="amt ${a.dir==='가지급금'?'out':'in'}">${wonS(a.amt)}</div>
      <button class="del" onclick="toggleAdv('${a.id}')">✓</button>
      <button class="del" onclick="delAdv('${a.id}')">×</button></div>`).join('')
      :'<div class="empty">기록이 없습니다</div>'}
    <div class="hr"></div>
    <div class="grid2">
      <div><label>구분</label><select id="v_dir"><option>가수금</option><option>가지급금</option></select></div>
      <div><label>금액</label><input type="number" id="v_amt" inputmode="numeric" placeholder="0"></div>
    </div>
    <label>사유 <span class="muted">(반드시 구체적으로)</span></label>
    <input type="text" id="v_reason" placeholder="예: 대표이사 운영자금 대여">
    <button class="btn sub" onclick="addAdv()">＋ 기록 추가</button>
    <div class="muted" style="margin-top:8px">가지급금은 인정이자가 과세되고 세무조사의 주요 지적사항입니다. 발생 즉시 사유와 상환계획을 남기세요.</div>
  </div>

  <div class="card">
    <h3>물건 관리</h3>
    ${(S.corp.props||[]).map(p=>`<div class="item"><div class="ic" style="background:var(--corp)">物</div>
      <div class="mid"><div class="n">${p.name}</div><div class="s">${p.addr}<br>${p.status} · ${p.memo||''}</div></div>
      <button class="del" onclick="delItem('props','${p.id}')">×</button></div>`).join('')||'<div class="empty">등록된 물건이 없습니다</div>'}
    <div class="hr"></div>
    <label>물건명</label><input type="text" id="p_name" placeholder="예: 장위동 502호">
    <label>주소</label><input type="text" id="p_addr" placeholder="전체 주소">
    <div class="grid2">
      <div><label>상태</label><select id="p_status"><option>검토중</option><option>계약</option><option>보유(임대)</option><option>보유(임차)</option><option>매도완료</option></select></div>
      <div><label>취득가</label><input type="number" id="p_cost" placeholder="0"></div>
    </div>
    <button class="btn sub" onclick="addProp()">＋ 물건 추가</button>
    <div class="muted" style="margin-top:8px">경매·공매 취득 시 법원 납부영수증, 매각허가결정문, 배당표까지 보관해야 취득가액이 인정됩니다.</div>
  </div>

  <div class="card">
    <h3>연간 세무 일정</h3>
    ${TAXCAL.map(t=>`<div class="row">
      <span class="lbl" style="${t.m===m?'color:var(--warn);font-weight:800':''}">${t.m===m?'🔴 ':''}${t.m}월 ${t.d}일</span>
      <span class="val" style="font-size:12.5px;font-weight:600;${t.m===m?'color:var(--warn)':'color:var(--sub)'}">${t.name}</span></div>`).join('')}
  </div>`;
}
function addAdv(){
  const a=+document.getElementById('v_amt').value;
  if(!a){alert('금액을 입력하세요');return;}
  S.corp.adv.push({id:u(),date:new Date().toISOString().slice(0,10),
    dir:document.getElementById('v_dir').value,amt:a,
    reason:document.getElementById('v_reason').value||'(사유 미기재)',back:false});
  save();render();
}
function toggleAdv(id){const a=S.corp.adv.find(x=>x.id===id);if(a){a.back=!a.back;save();render();}}
function delAdv(id){S.corp.adv=S.corp.adv.filter(x=>x.id!==id);save();render();}
function addProp(){
  const n=document.getElementById('p_name').value;
  if(!n){alert('물건명을 입력하세요');return;}
  S.corp.props.push({id:u(),name:n,addr:document.getElementById('p_addr').value,
    status:document.getElementById('p_status').value,cost:+document.getElementById('p_cost').value||0,
    buy:new Date().toISOString().slice(0,10),memo:''});
  save();render();
}

/* ── 백업 ── */
function exportJSON(){
  const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download=`가계부백업_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}
function importJSON(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{S=JSON.parse(r.result);save();render();alert('불러왔습니다');}
    catch(err){alert('파일을 읽을 수 없습니다');}};
  r.readAsText(f);
}
function resetAll(){
  if(!confirm('입력한 모든 데이터가 삭제됩니다. 계속할까요?'))return;
  S=blank();save();TAB='dash';render();
  alert('초기화되었습니다.');
}
function loadSample(){
  if(!confirm('예시 데이터를 불러오면 지금 입력한 내용이 모두 대체됩니다. 계속할까요?'))return;
  S=sample();save();TAB='dash';render();
}

render();
setTimeout(checkAlerts,1500);

/* ═══════════════ PWA 설치 · 오프라인 ═══════════════ */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredPrompt=e;
  document.getElementById('installBar').classList.add('show');
});
function doInstall(){
  if(!deferredPrompt){
    alert('브라우저 메뉴(⋮)에서 "홈 화면에 추가"를 선택하세요.');
    return;
  }
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(()=>{
    deferredPrompt=null;
    document.getElementById('installBar').classList.remove('show');
  });
}
window.addEventListener('appinstalled',()=>{
  document.getElementById('installBar').classList.remove('show');
});
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
